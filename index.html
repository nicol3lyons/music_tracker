<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtistPulse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1e1e1e;--surface3:#252525;
  --border:#2c2c2c;--border2:#383838;
  --text:#ffffff;--text2:#a0a0a0;--text3:#555;
  --sidebar:240px;
  --font:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

/* LAYOUT */
.layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:200;display:flex;flex-direction:column}
.sidebar-header{padding:1.2rem 1.2rem 0.8rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-logo{font-family:var(--display);font-size:18px;letter-spacing:0.1em;color:#fff;margin-bottom:2px}
.sidebar-sub{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em}
.sidebar-section{padding:0.8rem 1.2rem 0.4rem;font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-section span{color:#fff;opacity:0.3;font-size:8px;float:right;margin-top:1px}
.shows-feed{flex:1;overflow-y:auto;padding-bottom:1rem}
.show-card{padding:10px 1.2rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.show-card:hover{background:var(--surface2)}
.show-card-date{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.show-card-artist{font-size:12px;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-card-venue{font-family:var(--mono);font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.show-card-tickets{display:inline-block;font-family:var(--mono);font-size:9px;color:var(--text3);border:1px solid var(--border);border-radius:2px;padding:2px 7px;text-decoration:none;transition:all 0.15s}
.show-card-tickets:hover{color:#fff;border-color:#fff}
.shows-loading{padding:1.2rem;font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center}
.shows-empty{padding:1.2rem;font-family:var(--mono);font-size:10px;color:var(--text3);text-align:center;line-height:1.6}
.sidebar-footer{padding:0.8rem 1.2rem;border-top:1px solid var(--border);flex-shrink:0}
.sidebar-footer-text{font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.5}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;min-width:0}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,13,13,0.95);backdrop-filter:blur(12px);z-index:100}
.nav-logo{font-family:var(--display);font-size:20px;letter-spacing:0.08em;color:#fff}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:12px;padding:6px 16px;border-radius:3px;cursor:pointer;transition:all 0.18s}
.nav-back:hover{border-color:#666;color:#fff}
.refresh-btn{background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:10px;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all 0.18s;letter-spacing:0.05em}
.refresh-btn:hover{border-color:#fff;color:#fff}
.refresh-btn.loading{opacity:0.4;cursor:not-allowed}
.live-pill{font-family:var(--mono);font-size:10px;color:var(--text3);display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:#fff;opacity:0.4;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:0.4}50%{opacity:0.1}}
.status-bar{padding:8px 2rem;background:var(--surface);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3);display:none}
.status-bar.visible{display:block}

/* DASHBOARD */
.dash-header{padding:2.5rem 2rem 1.5rem;border-bottom:1px solid var(--border)}
.dash-title{font-family:var(--display);font-size:56px;letter-spacing:0.04em;line-height:1;color:#fff;margin-bottom:6px}
.dash-meta{display:flex;align-items:center;gap:16px;margin-top:6px}
.dash-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase}
.rank-col-header{display:grid;grid-template-columns:50px 58px 1fr 140px 100px 90px 28px;padding:8px 2rem;border-bottom:1px solid var(--border2)}
.col-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em}
.rank-row{display:grid;grid-template-columns:50px 58px 1fr 140px 100px 90px 28px;align-items:center;padding:0 2rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;min-height:66px;position:relative}
.rank-row:hover{background:var(--surface)}
.rank-row.top{background:var(--surface)}
.rank-num{font-family:var(--display);font-size:24px;color:var(--text3)}
.rank-row.top .rank-num{color:#fff}
.rank-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;background:var(--surface2)}
.rank-photo-placeholder{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:14px;color:var(--text3)}
.rank-info{padding-left:14px}
.rank-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-genre{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.rank-stat{font-family:var(--mono);font-size:12px;color:var(--text2)}
.rank-growth{font-family:var(--mono);font-size:12px;color:#fff;font-weight:500}
.rank-growth.negative{color:var(--text3)}
.rank-arrow{color:var(--text3);font-size:14px;text-align:right}
.top-badge{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;background:var(--surface3);border:1px solid var(--border2);border-radius:2px;padding:2px 5px;margin-left:6px;vertical-align:middle}

/* ARTIST PAGE */
.artist-page{animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.banner-wrap{width:100%;height:260px;position:relative;overflow:hidden;background:var(--surface2)}
.banner-img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.4)}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,0.98) 0%,rgba(13,13,13,0.05) 55%)}
.banner-artist-info{position:absolute;bottom:0;left:0;right:0;padding:1.8rem 2rem;display:flex;align-items:flex-end;gap:20px}
.banner-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1);flex-shrink:0;background:var(--surface3)}
.banner-name{font-family:var(--display);font-size:46px;letter-spacing:0.04em;line-height:1;color:#fff;margin-bottom:4px}
.banner-genre{font-family:var(--mono);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.artist-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--border2);border-radius:2px;padding:3px 8px;font-size:10px;font-family:var(--mono);color:var(--text2);letter-spacing:0.04em}
.artist-content{padding:1.8rem 2rem}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.8rem}
.stat-card{background:var(--surface);padding:18px 20px}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.stat-value{font-family:var(--display);font-size:34px;letter-spacing:0.02em;color:#fff;margin-bottom:4px;line-height:1}
.stat-value.small{font-size:18px;margin-top:6px}
.stat-change{font-family:var(--mono);font-size:10px;color:var(--text2)}
.section{margin-bottom:2rem}
.section-label{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.shows-list-full{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.show-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface)}
.show-date-full{font-family:var(--mono);font-size:11px;color:var(--text2);min-width:90px}
.show-info{flex:1}
.show-venue-full{font-size:13px;font-weight:500;color:#fff}
.show-loc{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:2px}
.show-tix{font-family:var(--mono);font-size:10px;color:var(--text2);text-decoration:none;border:1px solid var(--border2);padding:3px 10px;border-radius:2px;transition:all 0.15s}
.show-tix:hover{color:#fff;border-color:#fff}
.no-shows-box{padding:18px;font-family:var(--mono);font-size:11px;color:var(--text3);text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:4px}
.bio-box{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;font-size:14px;line-height:1.85;color:var(--text2);font-weight:300}
.growth-box{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px 20px}
.growth-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.growth-label{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.growth-val{font-family:var(--display);font-size:38px;letter-spacing:0.02em;color:#fff}
.growth-track{background:var(--surface3);border-radius:2px;height:3px;overflow:hidden}
.growth-fill{height:100%;background:#fff;border-radius:2px;transition:width 0.9s cubic-bezier(0.16,1,0.3,1)}
</style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR: LA SHOWS -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">ARTISTPULSE</div>
      <div class="sidebar-sub">Your Roster</div>
    </div>
    <div class="sidebar-section">
      📍 Playing in LA <span id="la-count"></span>
    </div>
    <div class="shows-feed" id="la-shows">
      <div class="shows-loading">Finding LA shows...</div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-text">Shows within 50mi of Los Angeles · via Bandsintown</div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div id="root"></div>
  </div>

</div>

<script>
const SPOTIFY_CLIENT_ID = '8cfbf049b5bf4a99aa56f46aa38fe990';
const SPOTIFY_CLIENT_SECRET = '4b91ee48590d4f3fa22c46894fd83024';
const BANDSINTOWN_APP_ID = '930d86ac9787e4f84a8b38c8f4dd9ce1';

const ARTISTS = [
  { id:'6mTKr75iC5ubQKWo1IRVrg', name:'Weval', genre:'Electronic' },
  { id:'3fhpMgaFAaEMvxzI4CJZOA', name:'LE YORA', genre:'Indie / Electronic' },

  { id:'4JAjBkVCvAlH2MhXnFJBjO', name:'Bayonne', genre:'Electronic / Indie' },
  { id:'7GJQDJgBNEKwwJHqCpBJaB', name:'KILIMANJARO', genre:'Indie' },
  { id:'6GI52t8N5mb3236ehqiaTv', name:'Cut Copy', genre:'Electronic / Indie' },

];

// LA area cities to match
const LA_CITIES = ['los angeles','la','hollywood','silver lake','echo park','koreatown',
  'west hollywood','santa monica','culver city','long beach','anaheim','pasadena',
  'burbank','glendale','pomona','inglewood','compton','torrance','hawthorne',
  'el segundo','manhattan beach','hermosa beach','redondo beach','carson',
  'van nuys','north hollywood','studio city','sherman oaks','encino','woodland hills'];

function isLA(event) {
  if (!event.venue) return false;
  const city = (event.venue.city || '').toLowerCase();
  const region = (event.venue.region || '').toLowerCase();
  const country = (event.venue.country || '').toLowerCase();
  if (country !== 'united states' && country !== 'us' && country !== 'usa') return false;
  return LA_CITIES.some(c => city.includes(c)) || (region === 'ca' && LA_CITIES.some(c => city.includes(c)));
}

function fmtDate(dt) {
  return new Date(dt).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function fmtNum(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toLocaleString();
}

// ---- SPOTIFY ----
let spotifyToken = null;
let artistData = {};
let currentArtistId = null;

async function getSpotifyToken() {
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST',
    headers:{
      'Content-Type':'application/x-www-form-urlencoded',
      'Authorization':'Basic ' + btoa(SPOTIFY_CLIENT_ID+':'+SPOTIFY_CLIENT_SECRET)
    },
    body:'grant_type=client_credentials'
  });
  const d = await res.json();
  spotifyToken = d.access_token;
}

async function fetchSpotifyArtist(id) {
  const res = await fetch(`https://api.spotify.com/v1/artists/${id}`, {
    headers:{'Authorization':'Bearer '+spotifyToken}
  });
  return res.json();
}

function saveSnap(id, val) {
  const k = 'ap_snap_'+id;
  const arr = JSON.parse(localStorage.getItem(k)||'[]');
  arr.push({ts:Date.now(), v:val});
  if(arr.length>10) arr.shift();
  localStorage.setItem(k, JSON.stringify(arr));
}

function getGrowth(id, cur) {
  const arr = JSON.parse(localStorage.getItem('ap_snap_'+id)||'[]');
  if(arr.length < 2) return 0;
  const old = arr[0].v;
  if(!old) return 0;
  return parseFloat(((cur - old)/old*100).toFixed(1));
}

async function loadAllArtists() {
  setStatus('Connecting to Spotify...');
  showRefreshing(true);
  try { await getSpotifyToken(); } catch(e) {
    setStatus('Could not connect to Spotify.');
    showRefreshing(false);
    return;
  }
  for(let i=0; i<ARTISTS.length; i+=5) {
    const batch = ARTISTS.slice(i, i+5);
    setStatus(`Loading artists ${i+1}–${Math.min(i+5,ARTISTS.length)} of ${ARTISTS.length}...`);
    await Promise.all(batch.map(async a => {
      try {
        const d = await fetchSpotifyArtist(a.id);
        if(d && d.followers) {
          const f = d.followers.total;
          saveSnap(a.id, f);
          artistData[a.id] = {
            ...a,
            followers: f,
            photo: d.images?.[0]?.url || null,
            popularity: d.popularity || 0,
            genres: d.genres || [],
            spotifyUrl: d.external_urls?.spotify,
            growth: getGrowth(a.id, f)
          };
        }
      } catch(e) {
        artistData[a.id] = {...a, followers:0, growth:0, photo:null, popularity:0, genres:[]};
      }
    }));
    if(i+5 < ARTISTS.length) await new Promise(r=>setTimeout(r,300));
  }
  setStatus('');
  showRefreshing(false);
  renderDashboard();
}

// ---- BANDSINTOWN: LA SIDEBAR ----
async function loadLAShows() {
  const container = document.getElementById('la-shows');
  const countEl = document.getElementById('la-count');
  let allLAShows = [];

  for(const artist of ARTISTS) {
    try {
      const encoded = encodeURIComponent(artist.name);
      const res = await fetch(`https://rest.bandsintown.com/artists/${encoded}/events?app_id=${BANDSINTOWN_APP_ID}&date=upcoming`);
      const events = await res.json();
      if(Array.isArray(events)) {
        const laEvents = events.filter(isLA).map(e => ({...e, artistName: artist.name, artistId: artist.id}));
        allLAShows = allLAShows.concat(laEvents);
      }
    } catch(e) {}
    await new Promise(r=>setTimeout(r,80));
  }

  // Sort by date
  allLAShows.sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

  if(allLAShows.length === 0) {
    container.innerHTML = `<div class="shows-empty">No upcoming LA shows found for your tracked artists right now.</div>`;
    countEl.textContent = '0';
    return;
  }

  countEl.textContent = allLAShows.length;
  container.innerHTML = allLAShows.map(e => `
    <div class="show-card" onclick="openArtist('${e.artistId}')">
      <div class="show-card-date">${fmtDate(e.datetime)}</div>
      <div class="show-card-artist">${e.artistName}</div>
      <div class="show-card-venue">${e.venue?.name || '—'}</div>
      ${e.url ? `<a href="${e.url}" target="_blank" onclick="event.stopPropagation()" class="show-card-tickets">Tickets ↗</a>` : ''}
    </div>
  `).join('');
}

// ---- BANDSINTOWN: ARTIST PAGE SHOWS ----
async function loadArtistShows(artistName) {
  const container = document.getElementById('artist-shows');
  if(!container) return;
  try {
    const encoded = encodeURIComponent(artistName);
    const res = await fetch(`https://rest.bandsintown.com/artists/${encoded}/events?app_id=${BANDSINTOWN_APP_ID}&date=upcoming`);
    const events = await res.json();
    if(!Array.isArray(events) || events.length === 0) {
      container.innerHTML = `<div class="no-shows-box">No upcoming shows for ${artistName}.</div>`;
      return;
    }
    container.innerHTML = `
      <div class="shows-list-full">
        ${events.slice(0,8).map(e => `
          <div class="show-item">
            <div class="show-date-full">${new Date(e.datetime).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
            <div class="show-info">
              <div class="show-venue-full">${e.venue?.name || '—'}</div>
              <div class="show-loc">${e.venue?.city || ''}, ${e.venue?.region || ''} ${e.venue?.country || ''}</div>
            </div>
            ${e.url ? `<a href="${e.url}" target="_blank" class="show-tix">Tickets ↗</a>` : ''}
          </div>
        `).join('')}
      </div>
    `;
  } catch(err) {
    container.innerHTML = `<div class="no-shows-box">Could not load shows.</div>`;
  }
}

// ---- UI HELPERS ----
function setStatus(msg) {
  const b = document.getElementById('status-bar');
  if(!b) return;
  b.textContent = msg;
  b.className = msg ? 'status-bar visible' : 'status-bar';
}

function showRefreshing(on) {
  const btn = document.getElementById('refresh-btn');
  if(!btn) return;
  btn.textContent = on ? 'Loading...' : 'Refresh';
  btn.disabled = on;
  btn.className = on ? 'refresh-btn loading' : 'refresh-btn';
}

// ---- RENDER DASHBOARD ----
function renderDashboard() {
  const sorted = Object.values(artistData).sort((a,b)=>(b.growth||0)-(a.growth||0));
  const today = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

  document.getElementById('root').innerHTML = `
    <nav class="nav">
      <div class="nav-logo">GROWTH BOARD</div>
      <div class="nav-right">
        <div class="live-pill"><span class="dot"></span>${today}</div>
        <button class="refresh-btn" id="refresh-btn" onclick="loadAllArtists()">Refresh</button>
      </div>
    </nav>
    <div id="status-bar" class="status-bar"></div>
    <div class="dash-header">
      <div class="dash-title">ARTIST TRACKER</div>
      <div class="dash-meta">
        <span class="dash-sub">${ARTISTS.length} artists</span>
        <span class="dash-sub" style="color:var(--border2)">·</span>
        <span class="dash-sub">ranked by growth</span>
      </div>
    </div>
    <div class="rank-col-header">
      <div class="col-label">#</div>
      <div class="col-label"></div>
      <div class="col-label" style="padding-left:14px">Artist</div>
      <div class="col-label">Followers</div>
      <div class="col-label">Popularity</div>
      <div class="col-label">Growth</div>
      <div></div>
    </div>
    ${sorted.length === 0 ? `
      <div style="padding:3rem 2rem;font-family:var(--mono);font-size:12px;color:var(--text3)">
        Loading artist data from Spotify... takes ~30 seconds on first run.
      </div>
    ` : sorted.map((a,i) => `
      <div class="rank-row ${i===0?'top':''}" onclick="openArtist('${a.id}')">
        <div class="rank-num">${String(i+1).padStart(2,'0')}</div>
        <div>
          ${a.photo
            ? `<img class="rank-photo" src="${a.photo}" alt="${a.name}" onerror="this.style.display='none'">`
            : `<div class="rank-photo-placeholder">${a.name.slice(0,2).toUpperCase()}</div>`
          }
        </div>
        <div class="rank-info">
          <div class="rank-name">${a.name}${i===0?'<span class="top-badge">Top Mover</span>':''}</div>
          <div class="rank-genre">${a.genre}</div>
        </div>
        <div class="rank-stat">${fmtNum(a.followers)}</div>
        <div class="rank-stat">${a.popularity||'—'}</div>
        <div class="rank-growth ${(a.growth||0)<0?'negative':''}">${(a.growth||0)>0?'+':''}${a.growth||0}%</div>
        <div class="rank-arrow">›</div>
      </div>
    `).join('')}
  `;
}

// ---- RENDER ARTIST PAGE ----
function renderArtist(id) {
  const a = artistData[id];
  if(!a) return;
  document.getElementById('root').innerHTML = `
    <nav class="nav">
      <div class="nav-logo">ARTISTPULSE</div>
      <button class="nav-back" onclick="goBack()">← Back</button>
    </nav>
    <div class="artist-page">
      <div class="banner-wrap">
        ${a.photo?`<img class="banner-img" src="${a.photo}" alt="${a.name}">`:''}
        <div class="banner-overlay"></div>
        <div class="banner-artist-info">
          ${a.photo?`<img class="banner-photo" src="${a.photo}" alt="${a.name}">`:''}
          <div>
            <div class="banner-name">${a.name}</div>
            <div class="banner-genre">${a.genre}</div>
            <div class="artist-tags">
              ${(a.genres||[]).slice(0,3).map(g=>`<span class="tag">${g}</span>`).join('')}
              ${a.spotifyUrl?`<a href="${a.spotifyUrl}" target="_blank" class="tag" style="text-decoration:none">Spotify ↗</a>`:''}
            </div>
          </div>
        </div>
      </div>
      <div class="artist-content">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Followers</div>
            <div class="stat-value">${fmtNum(a.followers)}</div>
            <div class="stat-change">Spotify followers</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Popularity</div>
            <div class="stat-value">${a.popularity||'—'}</div>
            <div class="stat-change">Out of 100</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Growth</div>
            <div class="stat-value">${(a.growth||0)>0?'+':''}${a.growth||0}%</div>
            <div class="stat-change">vs last snapshot</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Genres</div>
            <div class="stat-value small">${(a.genres||[]).slice(0,2).join(', ')||'—'}</div>
            <div class="stat-change">Spotify tags</div>
          </div>
        </div>
        <div class="section">
          <div class="section-label">Upcoming Shows</div>
          <div id="artist-shows"><div class="no-shows-box">Loading shows...</div></div>
        </div>
        <div class="section">
          <div class="section-label">Growth Tracker</div>
          <div class="growth-box">
            <div class="growth-top">
              <span class="growth-label">Follower growth since first snapshot</span>
              <span class="growth-val">${(a.growth||0)>0?'+':''}${a.growth||0}%</span>
            </div>
            <div class="growth-track">
              <div class="growth-fill" id="gbar" style="width:0%"></div>
            </div>
            <div style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:10px">
              Accuracy improves each time you refresh — compares current followers to your first recorded snapshot.
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
  setTimeout(()=>{
    const b = document.getElementById('gbar');
    if(b) b.style.width = Math.min(Math.abs(a.growth||0)*3,100)+'%';
  },120);
  loadArtistShows(a.name);
  window.scrollTo(0,0);
}

function openArtist(id) {
  currentArtistId = id;
  renderArtist(id);
}

function goBack() {
  currentArtistId = null;
  renderDashboard();
}

// ---- BOOT ----
renderDashboard();
loadAllArtists();
loadLAShows();
</script>
</body>
</html>
