<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtistPulse — Musician Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#111111;--surface2:#181818;--surface3:#202020;
  --border:#2a2a2a;--border2:#333;
  --text:#f0ede8;--text2:#888;--text3:#555;
  --accent:#c8f542;--accent2:#a8d420;
  --red:#ff4f4f;--blue:#4fa8ff;--purple:#b47fff;
  --font:'Syne',sans-serif;--mono:'DM Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
.app{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.nav-logo{font-size:13px;font-weight:700;letter-spacing:0.15em;color:var(--accent);text-transform:uppercase}
.nav-back{background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s}
.nav-back:hover{border-color:var(--text2);color:var(--text)}
.dash-header{margin-bottom:2.5rem}
.dash-title{font-size:38px;font-weight:800;letter-spacing:-0.02em;line-height:1;margin-bottom:8px}
.dash-title span{color:var(--accent)}
.dash-sub{color:var(--text2);font-size:13px;font-family:var(--mono);letter-spacing:0.04em}
.updated{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-family:var(--mono);color:var(--text2);margin-top:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.rank-list{display:flex;flex-direction:column;gap:10px}
.rank-item{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.rank-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity 0.2s}
.rank-item:hover{border-color:var(--border2);transform:translateX(4px)}
.rank-item:hover::before{opacity:1}
.rank-item.top1{border-color:#3a3a1a}
.rank-item.top1::before{opacity:1}
.rank-num{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--text3);min-width:36px}
.rank-item.top1 .rank-num{color:var(--accent)}
.rank-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:16px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px}
.rank-genre{font-size:11px;font-family:var(--mono);color:var(--text2);letter-spacing:0.05em;text-transform:uppercase}
.rank-stats{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rank-growth{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent)}
.rank-streams{font-family:var(--mono);font-size:11px;color:var(--text2)}
.rank-arrow{color:var(--text3);font-size:18px;margin-left:8px}
.crown{font-size:10px;position:absolute;top:10px;right:14px;color:var(--accent);font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase}
.artist-page{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.artist-hero{display:flex;align-items:flex-start;gap:24px;margin-bottom:2.5rem;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.artist-avatar-lg{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;flex-shrink:0}
.artist-hero-info{flex:1}
.artist-hero-name{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px}
.artist-hero-genre{font-size:12px;font-family:var(--mono);color:var(--text2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px}
.artist-tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-family:var(--mono);color:var(--text2)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-label{font-size:10px;font-family:var(--mono);color:var(--text2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.stat-value{font-size:24px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.stat-change{font-size:11px;font-family:var(--mono);color:var(--accent)}
.section{margin-bottom:2rem}
.section-title{font-size:11px;font-family:var(--mono);color:var(--text2);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.releases{display:flex;flex-direction:column;gap:8px}
.release{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.release-icon{width:38px;height:38px;background:var(--surface2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.release-info{flex:1}
.release-title{font-size:14px;font-weight:600;margin-bottom:2px}
.release-meta{font-size:11px;font-family:var(--mono);color:var(--text2)}
.release-streams{font-family:var(--mono);font-size:12px;color:var(--accent)}
.bio{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:14px;line-height:1.8;color:#b0ada8}
.growth-bar-bg{background:var(--surface2);border-radius:4px;height:4px;overflow:hidden}
.growth-bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width 0.8s ease}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
